<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PG Guru</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<style>
:root{--bg:#f4f6fb;--card:#ffffff;--ink:#0f172a;--muted:#64748b;--acc:#4f46e5;--acc2:#7c3aed;--ok:#059669;--bad:#dc2626;--line:#e2e8f0;--shadow:0 1px 2px rgba(15,23,42,.04),0 4px 16px rgba(15,23,42,.06);color-scheme:light}
@media (prefers-color-scheme: dark){:root:not([data-theme=light]){--bg:#0b1020;--card:#131a2e;--ink:#e6ebf5;--muted:#8b97b0;--line:#222c45;--shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);color-scheme:dark}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);padding-bottom:env(safe-area-inset-bottom,0px);-webkit-font-smoothing:antialiased;line-height:1.45}
#top{position:sticky;top:0;z-index:5;background:var(--bg);backdrop-filter:saturate(1.4) blur(10px);-webkit-backdrop-filter:saturate(1.4) blur(10px)}
header{background:linear-gradient(135deg,#0f172a 0%,#1e1b4b 55%,#4338ca 100%);color:#fff;padding:14px 18px 16px;padding-top:calc(14px + env(safe-area-inset-top,0px));box-shadow:0 8px 24px rgba(30,27,75,.25)}
header h1{margin:0;font-size:19px;font-weight:700;letter-spacing:-.01em}
header .sub{font-size:12px;opacity:.75;margin-top:2px}
nav{display:flex;gap:6px;padding:10px 12px;background:var(--card);border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{flex:0 0 auto;padding:8px 14px;border:0;border-radius:999px;background:transparent;color:var(--muted);font-size:13.5px;font-weight:500;white-space:nowrap;cursor:pointer;transition:all .15s}
nav button:hover{color:var(--ink);background:var(--bg)}
nav button.on{background:var(--acc);color:#fff;font-weight:600;box-shadow:0 4px 12px rgba(79,70,229,.35)}
main{padding:16px 14px 40px;max-width:680px;margin:auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px;box-shadow:var(--shadow)}
h2{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:22px 2px 10px;font-weight:700}
label{display:block;font-size:12.5px;font-weight:600;color:var(--muted);margin:12px 2px 6px}
input,select{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:12px;font-size:16px;background:var(--card);color:var(--ink);outline:none;transition:border-color .15s,box-shadow .15s;font-family:inherit}
input:focus,select:focus{border-color:var(--acc);box-shadow:0 0 0 4px rgba(79,70,229,.15)}
input[type=checkbox]{width:auto}
button{font-family:inherit}
button.p{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;border:0;border-radius:12px;padding:13px 16px;font-size:15px;font-weight:600;margin-top:14px;width:100%;box-shadow:0 6px 16px rgba(79,70,229,.3);cursor:pointer}
button.p.d{background:linear-gradient(135deg,#ef4444,#dc2626);box-shadow:0 6px 16px rgba(220,38,38,.25)}
button.s,a.s{background:var(--card);border:1px solid var(--line);color:var(--ink);border-radius:10px;padding:7px 12px;font-size:13px;font-weight:500;margin:4px 6px 0 0;display:inline-block;text-decoration:none;cursor:pointer}
button.s:hover,a.s:hover{border-color:var(--acc);color:var(--acc)}
button.s.d{color:var(--bad)}
.row{display:flex;justify-content:space-between;gap:10px;align-items:center}
.muted{color:var(--muted);font-size:13px}
.ok{color:var(--ok)}
.bad{color:var(--bad)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid .card{margin-bottom:0}
.stat{font-size:22px;font-weight:700;letter-spacing:-.02em;margin-top:6px;font-variant-numeric:tabular-nums}
.tag{display:inline-block;font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--bg);color:var(--muted);border:1px solid var(--line)}
.tag.ok{background:#ecfdf5;color:#047857;border-color:#a7f3d0}
@media (prefers-color-scheme: dark){:root:not([data-theme=light]) .tag.ok{background:#052e22;color:#6ee7b7;border-color:#065f46}}
.msg{padding:12px 14px;border-radius:12px;margin-bottom:12px;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);font-weight:500}
.msg.ok{color:var(--ok);border-color:#a7f3d0}
.msg.bad{color:var(--bad);border-color:#fecaca}

/* ---------- Premium polish (pass 2) ---------- */
body{background:radial-gradient(1200px 600px at 10% -10%,rgba(99,102,241,.13),transparent 60%),radial-gradient(900px 500px at 110% 10%,rgba(16,185,129,.09),transparent 60%),var(--bg);min-height:100vh}
@media (prefers-color-scheme: dark){:root:not([data-theme=light]) body{background:radial-gradient(1200px 600px at 10% -10%,rgba(99,102,241,.22),transparent 60%),radial-gradient(900px 500px at 110% 10%,rgba(16,185,129,.12),transparent 60%),var(--bg)}}
header{position:relative;overflow:hidden;border-bottom-left-radius:22px;border-bottom-right-radius:22px}
header::after{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.22),transparent 70%);pointer-events:none}
header h1{font-size:21px;display:flex;align-items:center;gap:8px}
header h1::before{content:"";width:10px;height:10px;border-radius:50%;background:#34d399;box-shadow:0 0 0 4px rgba(52,211,153,.25)}
nav{border-bottom:none;background:transparent;padding:12px 12px 6px}
nav button{background:var(--card);border:1px solid var(--line);box-shadow:0 1px 2px rgba(15,23,42,.04)}
nav button.on{background:linear-gradient(135deg,var(--acc),var(--acc2));border-color:transparent}
.card{background:linear-gradient(180deg,var(--card),var(--card));transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease;position:relative;overflow:hidden}
.card:hover{transform:translateY(-1px);box-shadow:0 2px 4px rgba(15,23,42,.05),0 12px 28px rgba(15,23,42,.10);border-color:#c7d2fe}
@media (prefers-color-scheme: dark){:root:not([data-theme=light]) .card:hover{border-color:#3730a3}}
.grid .card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:linear-gradient(180deg,var(--acc),var(--acc2));border-radius:4px 0 0 4px;opacity:.85}
.grid .card:nth-child(3n+2)::before{background:linear-gradient(180deg,#10b981,#34d399)}
.grid .card:nth-child(3n+3)::before{background:linear-gradient(180deg,#f59e0b,#fbbf24)}
.grid .card{padding:16px 16px 16px 20px}
.grid .muted{text-transform:uppercase;letter-spacing:.06em;font-size:11px;font-weight:700}
.stat{font-size:24px}
.stat.ok{color:#059669}
.stat.bad{color:#dc2626}
h2{display:flex;align-items:center;gap:8px;color:var(--muted)}
h2::before{content:"";width:6px;height:6px;border-radius:50%;background:linear-gradient(135deg,var(--acc),var(--acc2));flex:none}
h2[style*="margin-top:0"]::before{display:none}
.tag{padding:4px 10px;letter-spacing:.01em}
.tag.ok{box-shadow:0 0 0 3px rgba(16,185,129,.12)}
button.p{letter-spacing:.01em;transition:transform .12s ease,box-shadow .2s ease}
button.p:active{transform:scale(.98)}
button.s,a.s{transition:all .15s ease}
input,select{box-shadow:inset 0 1px 2px rgba(15,23,42,.04)}
.msg{border-left:4px solid var(--acc)}
.msg.ok{border-left-color:#10b981}
.msg.bad{border-left-color:#ef4444}
button[onclick^="bookBed"]{border-radius:16px !important;box-shadow:0 2px 6px rgba(15,23,42,.05) !important;transition:transform .15s ease,box-shadow .2s ease,background .2s ease !important}
button[onclick^="bookBed"]:hover{transform:translateY(-2px) !important;box-shadow:0 10px 22px rgba(79,70,229,.18) !important;border-color:#6366f1 !important}
button[onclick^="openMapBooked"]{border-radius:16px !important;box-shadow:0 6px 16px rgba(34,197,94,.25) !important;transition:transform .15s ease,box-shadow .2s ease !important}
button[onclick^="openMapBooked"]:hover{transform:translateY(-2px) !important;box-shadow:0 12px 26px rgba(34,197,94,.35) !important}
@media (prefers-color-scheme: dark){:root:not([data-theme=light]) button[onclick^="openMapBooked"]{background:#14532d !important;color:#dcfce7 !important;border-color:#22c55e !important}}
main{padding-top:6px}

:root[data-theme=light]{--bg:#f4f6fb;--card:#ffffff;--ink:#0f172a;--muted:#64748b;--line:#e2e8f0;color-scheme:light}
:root[data-theme=dark]{--bg:#0b1020;--card:#131a2e;--ink:#e6ebf5;--muted:#8b97b0;--line:#222c45;color-scheme:dark}
input+button.s{margin:6px 0 0}

/* ---------- Premium pass 3 ---------- */
#top{backdrop-filter:none;-webkit-backdrop-filter:none;background:transparent}
header{border-radius:0 0 26px 26px;padding-bottom:20px}
header h1{font-size:22px;font-weight:800;letter-spacing:-.02em}
nav{position:fixed;bottom:0;left:0;right:0;z-index:20;margin:0;padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px));background:color-mix(in srgb,var(--card) 88%,transparent);border-top:1px solid var(--line);box-shadow:0 -10px 30px rgba(15,23,42,.08);border-radius:0;gap:4px}
nav button{padding:9px 14px;font-size:12.5px;font-weight:600;flex:0 0 auto}
nav button.on{box-shadow:0 6px 16px rgba(79,70,229,.35)}
main{padding-bottom:120px}
.hero{background:linear-gradient(135deg,#0f172a 0%,#312e81 55%,#6d28d9 100%);color:#fff;border-radius:24px;padding:22px 22px 20px;margin:4px 0 16px;box-shadow:0 20px 44px rgba(49,46,129,.35);position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-50px;bottom:-70px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.22),transparent 70%);pointer-events:none}
.hero-kicker{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;opacity:.75}
.hero-num{font-size:38px;font-weight:800;letter-spacing:-.035em;margin:6px 0 4px;font-variant-numeric:tabular-nums}
.hero-sub{font-size:13px;opacity:.85}
.card{border-radius:20px}
.grid .card{border-radius:20px}
.grid .stat{font-size:25px}
h2{font-size:11.5px;letter-spacing:.1em;margin:24px 4px 12px}
button.p{border-radius:14px}
input,select{border-radius:14px}

/* ---------- Bed Map: SaaS style ---------- */
.page-head{margin:4px 2px 14px}
.page-h{font-size:24px;font-weight:800;letter-spacing:-.02em;margin:0 0 2px;color:var(--ink);text-transform:none}
.page-h::before{display:none}
.map-hero{background:linear-gradient(135deg,var(--card),var(--card));padding:20px}
.map-pct{font-size:40px}
.map-total{font-size:26px;font-weight:800;letter-spacing:-.02em}
.bar{height:10px;border-radius:999px;background:var(--line);overflow:hidden;margin:16px 0 14px}
.bar span{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--acc2));border-radius:999px;transition:width .4s ease}
.ms-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.ms{background:var(--bg);border-radius:14px;padding:12px}
.ms-l{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:700}
.ms-v{font-size:21px;font-weight:800;margin-top:3px;font-variant-numeric:tabular-nums}
.legend{display:flex;gap:16px;align-items:center;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin:6px 4px 12px}
.sw{display:inline-block;width:12px;height:12px;border-radius:4px;margin-right:6px;vertical-align:-1px}
.sw-v{border:2px dashed var(--muted)}
.sw-b{background:#bbf7d0;border:2px solid #22c55e}
.room-card{padding:16px}
.room-title{font-weight:700;font-size:16px;letter-spacing:-.01em}
.pill{font-size:11.5px;font-weight:700;padding:5px 11px;border-radius:999px;white-space:nowrap}
.pill-free{background:#eef2ff;color:#4338ca}
.pill-full{background:#dcfce7;color:#166534}
.seats{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:10px;margin-top:14px}
.seat{border-radius:16px;padding:12px 12px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:4px;font-family:inherit;min-width:0}
.seat-code{font-weight:800;font-size:15px}
.seat-name{font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.seat-v{background:var(--card);border:2px dashed var(--muted);color:var(--ink)}
.seat-v .seat-name{color:var(--muted)}
.seat-b{background:linear-gradient(135deg,#dcfce7,#bbf7d0);border:2px solid #22c55e;color:#14532d}
@media (prefers-color-scheme: dark){:root:not([data-theme=light]) .seat-b{background:linear-gradient(135deg,#14532d,#166534);color:#dcfce7}:root:not([data-theme=light]) .pill-free{background:#1e1b4b;color:#c7d2fe}:root:not([data-theme=light]) .pill-full{background:#052e22;color:#6ee7b7}:root:not([data-theme=light]) .sw-b{background:#14532d}}
:root[data-theme=dark] .seat-b{background:linear-gradient(135deg,#14532d,#166534);color:#dcfce7}
:root[data-theme=dark] .pill-free{background:#1e1b4b;color:#c7d2fe}
:root[data-theme=dark] .pill-full{background:#052e22;color:#6ee7b7}
:root[data-theme=dark] .sw-b{background:#14532d}

.map-hero .hero-kicker{font-size:10.5px;letter-spacing:.05em;line-height:1.3}

/* Compact occupancy card on the Bed Map */
.map-hero{padding:14px 16px}
.map-pct{font-size:28px}
.map-total{font-size:18px}
.map-hero .bar{height:8px;margin:12px 0 10px}
.map-hero .ms-row{gap:6px}
.map-hero .ms{padding:8px 10px;border-radius:12px}
.map-hero .ms-l{font-size:10px}
.map-hero .ms-v{font-size:16px;margin-top:2px}

/* Property selector and occupancy side by side on the Bed Map */
.map-top{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:stretch}
.map-top>.card{margin-bottom:0}
.map-top .map-hero{display:flex;flex-direction:column;justify-content:center}

/* Compact summary cards on the Dashboard */
.grid{gap:8px}
.grid .card{padding:10px 12px 10px 16px;border-radius:14px}
.grid .card::before{width:3px}
.grid .muted{font-size:10px;letter-spacing:.05em}
.grid .stat{font-size:18px;margin-top:4px}

/* ---------- Compact pass across all tabs ---------- */
main{padding:10px 10px 110px}
.card{padding:12px;margin-bottom:8px;border-radius:14px}
.page-head{margin:2px 2px 10px}
.page-h{font-size:20px}
h2{margin:14px 2px 8px;font-size:10.5px}
label{margin:8px 2px 4px;font-size:11.5px}
input,select{padding:8px 10px;font-size:15px;border-radius:10px}
button.p{padding:10px 12px;font-size:14px;margin-top:10px;border-radius:10px}
button.s,a.s{padding:5px 9px;font-size:12px;border-radius:8px}
.tag{padding:2px 7px;font-size:10.5px}
.muted{font-size:12px}
.hero{padding:14px 16px;border-radius:18px;margin:2px 0 10px}
.hero-num{font-size:26px;margin:3px 0 2px}
.hero-kicker{font-size:10px}
.hero-sub{font-size:12px}
.grid{gap:6px}
.grid .card{padding:8px 10px 8px 14px;border-radius:12px}
.grid .stat{font-size:16px;margin-top:3px}
.grid .muted{font-size:9.5px}
.row{gap:8px}
.msg{padding:8px 10px;font-size:13px;border-radius:10px;margin-bottom:8px}
nav{padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
nav button{padding:6px 11px;font-size:11.5px}
header{padding:10px 14px 12px;padding-top:calc(10px + env(safe-area-inset-top,0px))}
header h1{font-size:17px}
header .sub{font-size:11px}
/* Bed Map */
.map-top{gap:8px}
.map-hero{padding:10px 12px}
.map-pct{font-size:22px}
.map-total{font-size:15px}
.map-hero .bar{height:6px;margin:8px 0 8px}
.map-hero .ms{padding:6px 8px}
.map-hero .ms-l{font-size:9px}
.map-hero .ms-v{font-size:14px}
.map-hero .hero-kicker{font-size:9.5px}
.legend{font-size:11px;margin:4px 2px 8px;gap:12px}
.room-card{padding:10px}
.room-title{font-size:14px}
.pill{font-size:10px;padding:3px 8px}
.seats{grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:6px;margin-top:8px}
.seat{padding:8px 9px;border-radius:12px;gap:2px}
.seat-code{font-size:13px}
.seat-name{font-size:10.5px}
/* Tenants, OPEX, backup */
.stat{font-size:18px}

/* Active Tenants: two cards per row */
.tenant-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;align-items:start}
.tenant-grid .card{margin-bottom:0}
.tenant-grid .card b{font-size:14px}

/* Header and Dashboard hero follow the chosen accent colour (Backup > Appearance) */
header{background:linear-gradient(135deg,#0f172a 0%,var(--acc) 70%,var(--acc2) 100%) !important}
.hero{background:linear-gradient(135deg,#0f172a 0%,var(--acc) 60%,var(--acc2) 100%) !important}

/* Page background from Backup > Appearance */
:root{--page:radial-gradient(1200px 600px at 10% -10%,rgba(99,102,241,.13),transparent 60%),var(--bg)}
body{background:var(--page) !important;background-attachment:fixed}

/* Card colour from Backup > Appearance, with automatically matched text */
.card{background:var(--cardbg,var(--card)) !important;color:var(--card-ink,var(--ink))}
.card .muted{color:var(--card-ink,var(--muted));opacity:.8}

/* Coloured tabs: each tab has its own colour; the selected tab shows a two-colour highlight */
nav button:nth-child(1){--tc1:#6366f1;--tc2:#8b5cf6}
nav button:nth-child(2){--tc1:#10b981;--tc2:#14b8a6}
nav button:nth-child(3){--tc1:#f59e0b;--tc2:#f97316}
nav button:nth-child(4){--tc1:#0ea5e9;--tc2:#3b82f6}
nav button:nth-child(5){--tc1:#a855f7;--tc2:#ec4899}
nav button:nth-child(6){--tc1:#ef4444;--tc2:#f43f5e}
nav button:nth-child(7){--tc1:#64748b;--tc2:#334155}
nav button:not(.on){background:color-mix(in srgb,var(--tc1) 16%,var(--card)) !important;color:var(--tc1) !important;font-weight:600 !important}
nav button.on{background:linear-gradient(135deg,var(--tc1),var(--tc2)) !important;color:#fff !important;box-shadow:0 6px 16px color-mix(in srgb,var(--tc1) 40%,transparent) !important}

/* Dashboard profit/loss card follows the card colour from Backup > Appearance */
.hero{background:var(--cardbg,var(--card)) !important;color:var(--card-ink,var(--ink)) !important;border:1px solid var(--line)}
.hero-kicker,.hero-sub{color:var(--card-ink,var(--ink));opacity:.8}
.hero::after{background:radial-gradient(circle,rgba(0,0,0,.04),transparent 70%)}

/* PG Guru title bar uses its own colour from Backup > Appearance */
header{background:var(--hdr) !important;color:var(--hdr-ink,#ffffff) !important}
header .sub{opacity:.85}


/* Dashboard Month / Overall tabs */
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:4px;margin:2px 0 10px}
.seg button{flex:1;border:0;background:transparent;padding:8px 10px;border-radius:999px;font-weight:600;font-size:13px;color:var(--muted);cursor:pointer}
.seg button.on{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;box-shadow:0 4px 12px color-mix(in srgb,var(--acc) 35%,transparent)}

/* Overall tab: property slicer and month-by-month table */
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:6px 12px;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit}
.chip.on{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;border-color:transparent}
.tbl{width:100%;border-collapse:collapse;font-size:12px;min-width:460px}
.tbl th,.tbl td{padding:7px 6px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl th{color:var(--muted);font-size:10.5px;text-transform:uppercase;letter-spacing:.05em}
.tbl td.ok{color:#059669;font-weight:700}
.tbl td.bad{color:#dc2626;font-weight:700}

/* ---------- Visual refresh ---------- */
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes toastIn{from{opacity:0;transform:translateY(12px) scale(.98)}to{opacity:1;transform:none}}
main{animation:fadeUp .35s ease both}
.msg{position:fixed;left:12px;right:12px;bottom:84px;z-index:30;margin:0;text-align:center;box-shadow:0 12px 30px rgba(15,23,42,.18);animation:toastIn .3s ease both;border-radius:14px}
nav button{display:flex;flex-direction:column;align-items:center;min-width:64px}

function due(t){
  if(!t.checkin)return{expected:0,paid:0,due:0};
  const ci=new Date(t.checkin+'T00:00:00');
  const end=t.checkout?new Date(t.checkout+'T00:00:00'):new Date();
  const months=Math.max(0,(end.getFullYear()-ci.getFullYear())*12+(end.getMonth()-ci.getMonth())+(end.getDate()>=t.billDay?1:0));
  const expected=months*t.rent;
  const paid=db.payments.filter(p=>p.tenantId===t.id).reduce((s,p)=>s+p.amount,0);
  return{expected,paid,due:expected-paid};
}

    const why={
      'not-allowed':'This preview does not allow the Speak button to use the microphone, even when your phone allows it. '+keyboardTip,
      'service-not-allowed':'Speech service is blocked on this device. '+keyboardTip,
      'no-speech':'No speech was heard. Tap Speak and talk clearly.',

      'network':'Voice typing needs an internet connection. '+keyboardTip

  try{r.start();}catch(err){flash('Voice input could not start. '+keyboardTip,true);render();}

function miniChart(title,getM){
  const base=ymd(new Date()).slice(0,7).split('-').map(Number);
  const months=[...Array(6)].map((_,i)=>{const d=new Date(base[0],base[1]-1-(5-i),1);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');});
  const data=months.map(k=>({k,...getM(k)}));
  const max=Math.max(1,...data.flatMap(d=>[d.collected,d.opex,Math.abs(d.net)]));
  const W=640,H=230,floor=190,top=16,slot=W/6,bw=14;
  let g='';
  data.forEach((d,i)=>{
    const cx=i*slot+slot/2;
    [[d.collected,'#10b981',-(bw+3)],[d.opex,'#f59e0b',0],[Math.abs(d.net),d.net<0?'#ef4444':'#3b82f6',bw+3]].forEach(([v,c,o])=>{

    });

  });

/* Email sign-up: Firebase creates the account and emails a verification link */
async function createGoogleAccount(){
  const name=$('sn'), em=$('sid').toLowerCase(), pw=$('spw'), pw2=$('spw2');
  if(!name)return authErr('Enter your name.');
  if(!isEmail(em))return authErr('Enter a valid email address.');
  if(pw.length<6)return authErr('Password must be at least 6 characters.');
  if(pw!==pw2)return authErr('Passwords do not match.');
  if(!fbAuth)return authErr('Firebase is not connected.');
  try{
    const cred=await fbAuth.createUserWithEmailAndPassword(em,pw);
    await cred.user.updateProfile({displayName:name});
    await cred.user.sendEmailVerification();
    await fbAuth.signOut();
    ui.auth={view:'signin'};
    flash('Account created. We sent a verification email to '+em+'. Open it, then sign in.');
    render();
  }catch(err){authErr(fbMsg(err));}
}
/* Sign in: email uses Firebase; mobile uses the local demo accounts */
async function doSignIn(){
  const em=$('aemail').toLowerCase(), mo=$('amob'), pw=$('apass');
  if(!pw)return authErr('Enter your password.');
  if(em){
    if(!isEmail(em))return authErr('Enter a valid email address.');
    if(!fbAuth)return authErr('Firebase is not connected.');
    try{
      const cred=await fbAuth.signInWithEmailAndPassword(em,pw);
      if(!cred.user.emailVerified){await fbAuth.signOut();return authErr('Please verify your email first. Check your inbox, then sign in again.');}
      const u=localUpsert(cred.user); signIn(u.id);
    }catch(err){authErr(fbMsg(err));}
    return;
  }
  const u=findUser(mo);
  if(!u)return authErr('No account found for this mobile number.');
  if(!u.pass||hash(pw)!==u.pass)return authErr('Wrong password.');
  signIn(u.id);
}

}
const CH_PAL=['#6366f1','#10b981','#f59e0b','#0ea5e9','#ec4899','#8b5cf6','#f43f5e','#14b8a6'];
function sliceChart(items,kind,title){
  const total=items.reduce((s,i)=>s+i.value,0);
  const isPie=kind==='pie';
  const R=isPie?35:52, SW=isPie?70:20, C=2*Math.PI*R;
  let off=0;
  const segs=items.map(i=>{const len=total?(i.value/total)*C:0;const s=`<circle r="${R}" cx="70" cy="70" fill="none" stroke="${i.color}" stroke-width="${SW}" stroke-dasharray="${len} ${C-len}" stroke-dashoffset="${-off}" transform="rotate(-90 70 70)"/>`;off+=len;return s;}).join('');
  const centre=isPie?'':`<text x="70" y="66" text-anchor="middle" font-size="11" fill="currentColor" opacity=".7">Total</text><text x="70" y="84" text-anchor="middle" font-size="13" font-weight="700" fill="currentColor">${money(total)}</text>`;
  const legend=items.map(i=>`<div class="lg"><i style="background:${i.color}"></i>${esc(i.label)}<b>${money(i.value)}</b></div>`).join('')||'<div class="muted">No Data Yet.</div>';
  return `<div class="card"><h2 style="margin-top:0">${esc(title)}</h2><div class="donut-wrap"><svg viewBox="0 0 140 140" width="130" height="130">${total?'':`<circle r="${R}" cx="70" cy="70" fill="none" stroke="var(--line)" stroke-width="${SW}"/>`}${segs}${centre}</svg><div class="lgs">${legend}</div></div></div>`;
}
function barChartHTML(data,title){
  const W=640,H=220,floor=190,top=16,slot=W/Math.max(1,data.length),bw=Math.max(6,Math.min(16,slot*0.3));
  const max=Math.max(1,...data.flatMap(d=>[d.a,d.b]));
  let g='';
  data.forEach((d,i)=>{const cx=i*slot+slot/2;
    [[d.a,'#10b981',-(bw/2+2)],[d.b,'#f59e0b',bw/2+2]].forEach(([v,c,o])=>{const hgt=(v/max)*(floor-top);g+=`<rect x="${cx+o-bw/2}" y="${floor-hgt}" width="${bw}" height="${hgt}" rx="3" fill="${c}"/>`;});
    g+=`<text x="${cx}" y="${H-8}" font-size="10" text-anchor="middle" fill="currentColor" opacity=".7">${esc(d.label)}</text>`;
  });
  return `<div class="card"><h2 style="margin-top:0">${esc(title)}</h2><svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;color:var(--muted)">${g}<line x1="0" x2="${W}" y1="${floor}" y2="${floor}" stroke="var(--line)"/></svg><div class="muted" style="display:flex;gap:14px;margin-top:6px"><span><span style="color:#10b981">●</span> Collected</span><span><span style="color:#f59e0b">●</span> Opex</span></div></div>`;
}
function overallCharts(scope,rows){
  const now=ymd(new Date()).slice(0,7);

  const months=[...Array(12)].map((_,i)=>{const d=new Date(ny,nm-1-(11-i),1);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');});
  const bars=months.map(mo=>{const t=scope.reduce((a,p)=>{const m=propMetrics(p,mo);return {c:a.c+m.collected,o:a.o+m.opex};},{c:0,o:0});return {label:new Date(mo+'-01T00:00:00').toLocaleString('en-IN',{month:'short'}),a:t.c,b:t.o};});
  const pie=rows.map((r,i)=>({label:r.p.name,value:r.collected,color:CH_PAL[i%CH_PAL.length]})).filter(x=>x.value>0);
  const cat={};const ids=scope.map(p=>p.id);

  return `<h2>Charts</h2>`+barChartHTML(bars,'Collected Vs Opex (Last 12 Months)')+sliceChart(pie,'pie','Revenue Share By Property')+sliceChart(donut,'donut','Opex By Category (All Months)');

function opexDonut(scope,m){

  const legend=cats.map((c,i)=>`<div class="lg"><i style="background:${palette[i%palette.length]}"></i>${esc(c[0])}<b>${money(c[1])}</b></div>`).join('')||'<div class="muted">No Opex recorded for this month.</div>';
  return `<h2>Opex By Category</h2><div class="card donut-wrap"><svg viewBox="0 0 140 140" width="130" height="130"><circle r="${R}" cx="70" cy="70" fill="none" stroke="var(--line)" stroke-width="20"/>${segs}<text x="70" y="66" text-anchor="middle" font-size="11" fill="currentColor" opacity=".7">Total</text><text x="70" y="84" text-anchor="middle" font-size="13" font-weight="700" fill="currentColor">${money(total)}</text></svg><div class="lgs">${legend}</div></div>`;
}

function allOpexOf(p){
  const now=new Date(), nowIdx=now.getFullYear()*12+now.getMonth();
  return db.expenses.filter(e=>e.propId===p.id).reduce((s,e)=>{
    if(!e.recurring)return s+e.amount;
    const d=new Date(e.date+'T00:00:00'), cnt=Math.max(1,nowIdx-(d.getFullYear()*12+d.getMonth())+1);
    return s+e.amount*cnt;
  },0);
}
function propMetrics(p,m){
  const tIds=propTenantIds(p), tenantsP=db.tenants.filter(t=>tIds.has(t.id));
  const payMonth=x=>x.forMonth||x.date.slice(0,7);
  const collected=db.payments.filter(x=>tIds.has(x.tenantId)&&payMonth(x)===m).reduce((s,x)=>s+x.amount,0);
  const expected=tenantsP.filter(t=>billMonths(t).includes(m)).reduce((s,t)=>s+t.rent,0);
  const monthEnd=m+'-31';
  const opex=db.expenses.filter(e=>e.propId===p.id&&(e.recurring?e.date<=monthEnd:e.date.slice(0,7)===m)).reduce((s,e)=>s+e.amount,0);
  const allCollected=db.payments.filter(x=>tIds.has(x.tenantId)).reduce((s,x)=>s+x.amount,0);
  const allOpex=allOpexOf(p);
  const allOutstanding=tenantsP.reduce((s,t)=>s+due(t).due,0);
  const allExpected=tenantsP.reduce((s,t)=>s+billMonths(t).length*t.rent,0);
  return {collected,expected,opex,net:collected-opex,allCollected,allExpected,allOpex,allNet:allCollected-allOpex,allOutstanding};
}

function addProp(){

const jsa=s=>esc(String(s).replace(/\\/g,'\\\\').replace(/'/g,"\\'"));
function editProp(id,nm,ad){
  const p=db.properties.find(x=>x.id===id);
  if(!p)return fail('Property not found.');

  if(!nm.trim())return fail('Name cannot be empty.');

  p.name=nm.trim(); if(ad!==null)p.address=ad.trim();
  save(); flash('Property updated.'); render();
}
function editBlock(old,nn){
  const p=curProp();

  const n=nn.trim();
  if(!n)return fail('Property name cannot be empty.');
  if(n===old){render();return;}
  if(propBlocks(p).includes(n))return fail('That property name already exists.');
  db.beds.forEach(b=>{if(b.propId===p.id&&(b.block||'')===old)b.block=n;});
  db.blocks.forEach(x=>{if(x.propId===p.id&&x.name===old)x.name=n;});
  if(!db.blocks.some(x=>x.propId===p.id&&x.name===n))db.blocks.push({id:uid(),propId:p.id,name:n});
  save(); flash('Property name renamed.'); render();
}
function editRoom(block,room,nr){
  const p=curProp();

  const n=nr.trim();
  if(!n)return fail('Room number cannot be empty.');
  if(n===room){render();return;}
  if(propBeds(p).some(b=>bkey(b)===block+'|'+n))return fail('That room already exists under this property name.');
  db.beds.forEach(b=>{if(b.propId===p.id&&(b.block||'')===block&&b.room===room)b.room=n;});
  save(); flash('Room renamed.'); render();
}

function addBlock(){
  const p=curProp();

function delBlock(name){
  const p=curProp();
  if(propBeds(p).some(b=>(b.block||'')===name))return fail('A property name with rooms cannot be removed.');
  db.blocks=db.blocks.filter(x=>!(x.propId===p.id&&x.name===name)); save(); flash('Property name removed.'); render();

function addRoom(){
  const p=curProp();
  if(!p)return fail('Add a property first.');
  const p2=db.properties.find(x=>x.id===document.getElementById('rprop')?.value);
  if(!p2)return fail('Select a property first.');
  const block='';
  const room=$('rn'), n=Number($('rb')), rent=Number($('rr'));
  if(!room)return fail('Room number is required.');
  if(!(Number.isInteger(n)&&n>=1&&n<=5))return fail('Number of beds must be between 1 and 5 (beds are named A to E).');

  if(propBeds(p2).some(b=>bkey(b)===block+'|'+room))return fail('That room already exists under this property name.');
  for(let i=1;i<=n;i++)db.beds.push({id:uid(),propId:p2.id,block,room,bed:String.fromCharCode(64+i),rent});

function delRoom(block,room){
  const p=curProp();

  db.beds=db.beds.filter(b=>!ids.includes(b.id)); save(); flash('Room removed.'); render();

  <label>Bed</label>
  <select id="tb" onchange="document.getElementById('tr').value=bedRent(this.value)">
    ${vacant.filter(b=>bkey(b)===curK).map(b=>`<option value="${b.id}" ${pre&&b.id===pre.id?'selected':''}>Bed ${esc(b.room)}${esc(b.bed)} · ${money(b.rent)}/mo</option>`).join('')}
  </select>
  <label>Full name *</label><input id="tn"><button class="s" onclick="voice('tn')">🎙 Speak</button>
  <label>Mobile number (10 digits) *</label><input id="tm" inputmode="numeric" maxlength="10"><button class="s" onclick="voice('tm')">🎙 Speak</button>
  <label>Alternate Contact</label><input id="ta" inputmode="numeric"><button class="s" onclick="voice('ta')">🎙 Speak</button>
  <label>Emergency Contact</label><input id="te"><button class="s" onclick="voice('te')">🎙 Speak</button>
  <label>Check-in date *</label><input type="date" id="tc" value="${ymd(new Date())}">
  <label>Notice Period (Days)</label><input type="number" id="tnp" min="0" value="30">
  <label>Rent per month (₹) *</label><input type="number" id="tr" min="1" value="${bedRent(pre?pre.id:vacant.find(b=>bkey(b)===curK)?.id)}">
  <label>Rent Due Day Of Month (1 To 28)</label><input type="number" id="tbd" min="1" max="28" value="1">
  <label>Security Deposit (₹)</label><input type="number" id="tds" min="0" value="0">
  <label>Deposit Paid So Far (₹)</label><input type="number" id="tdp" min="0" value="0">
  <label>ID Type</label><select id="tit"><option>Aadhaar</option><option>PAN</option><option>Driving Licence</option><option>Passport</option><option>Other</option><option>None</option></select>
  <label>ID Number (Optional, Stored Only On This Device)</label><input id="tid"><button class="s" onclick="voice('tid')">🎙 Speak</button>
  <button class="p" onclick="allot()">Save Tenant</button></div>`;
}
function bedMap(){
  const p=curProp();
  if(!p)return '<div class="card muted">No Properties Yet. Add One In The Property Details Tab.</div>';
  const beds=propBeds(p);
  const total=beds.length, occ=beds.filter(b=>activeOf(b.id)).length, free=total-occ;
  const pct=total?Math.round(occ/total*100):0;
  const keys=[...new Set(beds.map(b=>bkey(b)))];
  const ms=(l,v,c)=>`<div class="ms"><div class="ms-l">${l}</div><div class="ms-v" style="${c?'color:'+c:''}">${v}</div></div>`;
  return `<div class="page-head"><h1 class="page-h">Bed Map</h1><div class="muted">Live occupancy across every room</div></div>
  <div class="map-top"><div class="card"><label>Property</label>${propSelect('mprop',p.id,'setMap')}</div>
  <div class="card map-hero">
    <div class="row"><div><div class="hero-kicker">Occupancy · ${esc(p.name)}</div><div class="hero-num map-pct">${pct}%</div></div>
    <div style="text-align:right"><div class="muted">Total beds</div><div class="map-total">${total}</div></div></div>
    <div class="bar"><span style="width:${pct}%"></span></div>
    <div class="ms-row">${ms('Booked',occ,'#16a34a')}${ms('Vacant',free,'#4f46e5')}${ms('Rooms',keys.length)}</div>
  </div></div>
  <div class="legend"><span><i class="sw sw-v"></i>Vacant</span><span><i class="sw sw-b"></i>Booked</span><span class="muted" style="margin-left:auto">Tap a vacant seat to book</span></div>
  ${keys.map(k=>{const [bl,r]=k.split('|');const rb=beds.filter(b=>bkey(b)===k);const fr=rb.filter(b=>!activeOf(b.id)).length;
    return `<div class="card room-card"><div class="row"><div><div class="room-title">${bl?esc(bl)+' · ':''}Room ${esc(r)}</div><div class="muted">${rb.length} bed${rb.length>1?'s':''}</div></div><span class="pill ${fr?'pill-free':'pill-full'}">${fr?fr+' vacant':'Full'}</span></div>
    <div class="seats">${rb.map(b=>{const t=activeOf(b.id);return t?`<button onclick="openMapBooked('${t.id}')" class="seat seat-b"><span class="seat-code">${esc(r)}${esc(b.bed)}</span><span class="seat-name">${esc(t.name)}</span></button>`:`<button onclick="bookBed('${b.id}')" class="seat seat-v"><span class="seat-code">${esc(r)}${esc(b.bed)}</span><span class="seat-name">Vacant</span></button>`;}).join('')}</div></div>`;}).join('')||'<div class="card muted">No Rooms Yet.</div>'}`;
}
function setMap(){ui.prop=$('mprop');ui.tenant=null;render();}
function bookBed(id){const b=db.beds.find(x=>x.id===id);if(!b)return;ui.prop=b.propId;ui.preBed=id;ui.tab='tenants';ui.tenant=null;render();}
function openMapBooked(tid){ui.tab='active';ui.tenant=tid;render();}
function allot(){
  const errs=[];
  const bedId=$('tb');
  if(!$('tn'))errs.push('Name is required.');
  if(!/^\d{10}$/.test($('tm')))errs.push('Mobile must be 10 digits.');
  if(!$('tc'))errs.push('Check-in date is required.');
  if(!(Number($('tr'))>0))errs.push('Rent must be above 0.');
  const day=Number($('tbd'));
  if(!(Number.isInteger(day)&&day>=1&&day<=28))errs.push('Rent due day must be between 1 and 28.');
  if(!bedId||activeOf(bedId))errs.push('Choose a vacant bed.');
  if(errs.length)return fail(errs.join(' '));
  const t={id:uid(),bedId,name:$('tn'),mobile:$('tm'),altContact:$('ta'),emergency:$('te'),
    checkin:$('tc'),noticeDays:Number($('tnp'))||0,rent:Number($('tr')),billDay:day,
    depositAmt:Number($('tds'))||0,depositPaid:Number($('tdp'))||0,
    idType:$('tit'),idNo:$('tid'),checkout:null,refund:0,deductions:0,deductReason:''};
  db.tenants.push(t); save(); flash('Tenant allotted.'); render();
}
function fillBeds(key){
  const p=curProp();
  const bedsIn=propBeds(p).filter(b=>bkey(b)===key&&!activeOf(b.id));
  document.getElementById('tb').innerHTML=bedsIn.map(b=>`<option value="${b.id}">Bed ${esc(b.room)}${esc(b.bed)} · ${money(b.rent)}/mo</option>`).join('');
  document.getElementById('tr').value=bedsIn[0]?bedRent(bedsIn[0].id):'';
}
function setTprop(){ui.prop=$('tprop');ui.tenant=null;render();}
function fmtD(s){const d=new Date(s+'T00:00:00');return isNaN(d)?'':d.toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'});}
function billMonths(t){
  if(!t.checkin)return[];
  const ci=new Date(t.checkin+'T00:00:00');
  const end=t.checkout?new Date(t.checkout+'T00:00:00'):new Date();
  const out=[];let y=ci.getFullYear(),m=ci.getMonth();
  const ey=end.getFullYear(),em=end.getMonth();
  while(y<ey||(y===ey&&m<em)||(y===ey&&m===em&&end.getDate()>=t.billDay)){
    out.push(y+'-'+String(m+1).padStart(2,'0'));
    m++;if(m>11){m=0;y++;}
  }
  return out;
}
function paidFor(t,mo){return db.payments.filter(p=>p.tenantId===t.id&&(p.forMonth||p.date.slice(0,7))===mo).reduce((s,p)=>s+p.amount,0);}
function rentRows(t){
  const months=billMonths(t).reverse();
  return months.map(mo=>{
    const exp=t.rent, got=paidFor(t,mo);
    const st=got>=exp?'Paid':got>0?'Partial':'Unpaid';
    const label=new Date(mo+'-01T00:00:00').toLocaleString('en-IN',{month:'short',year:'numeric'});
    const paidBtn=`<button class="s" onclick="markPaid('${t.id}','${mo}')">Mark paid</button>`;
    const unpaidBtn=`<button class="s d" onclick="markUnpaid('${t.id}','${mo}')">Mark unpaid</button>`;
    const actions=st==='Unpaid'?paidBtn:st==='Partial'?paidBtn+' '+unpaidBtn:unpaidBtn;
    return `<div class="card row"><div><b>${label}</b><div class="muted">Rent ${money(exp)} · Received ${money(got)}</div></div>
      <div><span class="st st-${st.toLowerCase()}"><i></i>${st}</span> ${actions}</div></div>`;
  }).join('')||'<div class="muted">No rent due yet.</div>';
}
function markPaid(tid,mo){
  const t=db.tenants.find(x=>x.id===tid);
  if(!t)return fail('Tenant not found.');
  const rem=t.rent-paidFor(t,mo);
  if(rem<=0)return fail('This month is already fully paid.');
  db.payments.push({id:uid(),tenantId:tid,amount:rem,date:ymd(new Date()),mode:'Marked paid',forMonth:mo});
  save(); flash('Rent for '+mo+' marked paid ('+money(rem)+').'); render();
}
function armed(key){if(ui.armed===key){ui.armed=null;return true;}ui.armed=key;flash('Tap the same button again to confirm.',true);render();return false;}
function markUnpaid(tid,mo){
  const t=db.tenants.find(x=>x.id===tid);
  if(!t)return fail('Tenant not found.');
  if(!armed('u|'+tid+'|'+mo))return;
  db.payments=db.payments.filter(p=>!(p.tenantId===tid&&(p.forMonth||p.date.slice(0,7))===mo));
  save(); flash('Rent for '+mo+' marked unpaid.'); render();
}
function delPay(id){
  if(!armed('p|'+id))return;
  db.payments=db.payments.filter(p=>p.id!==id); save(); flash('Payment deleted.'); render();
}
function openT(id){ui.tenant=id;render();}
function closeT(){ui.tenant=null;render();}
function tenantDetail(){
  const t=db.tenants.find(x=>x.id===ui.tenant);
  if(!t){ui.tenant=null;return tenants();}
  const b=db.beds.find(x=>x.id===t.bedId);
  const d=due(t);
  const pays=db.payments.filter(p=>p.tenantId===t.id).sort((a,c)=>c.date.localeCompare(a.date));
  return `<button class="s" onclick="closeT()">← Back</button>
  <div class="card"><div class="who big"><span class="av xl" style="background:${avCol(t.name)}">${initials(t.name)}</span><div><div class="det-name">${esc(t.name)}</div><div class="muted">${esc(propOfT(t))} · Room ${esc(codeOfT(t))}</div></div></div>
    <div class="muted">Mobile ${esc(t.mobile)} · Alternate ${esc(t.altContact)||'-'} · Emergency ${esc(t.emergency)||'-'}</div>
    <div class="muted">${b?.block?'Property '+esc(b.block)+' · ':''}Room ${esc(b?.room)} · Bed ${esc(b?.bed)} · Check-in ${fmtD(t.checkin)} · Notice ${t.noticeDays} days</div>
    <div class="muted">${esc(t.idType)}${t.idNo?' · '+esc(t.idNo):''}</div>
    <div class="muted">Rent ${money(t.rent)}/mo, due on day ${t.billDay} · Deposit ${money(t.depositAmt)}, paid ${money(t.depositPaid)}</div>
    <div class="stat ${d.due>0?'bad':'ok'}" style="margin-top:8px">${d.due>0?'Due '+money(d.due):'Paid up'}</div>
    <div class="muted">Expected ${money(d.expected)} · Received ${money(d.paid)}</div>
    ${d.due>0&&t.mobile?`<a class="s" target="_blank" href="${waLink(t.mobile,duesMessage(t))}">Send WhatsApp Reminder</a>`:''}
  </div>
  <div class="card"><h2 style="margin-top:0">Rent Status</h2>
  ${rentRows(t)}</div>
  ${t.checkout?`<div class="card">Checked out ${esc(t.checkout)} · Refund ${money(t.refund)}${t.deductions?` · Deducted ${money(t.deductions)} (${esc(t.deductReason)})`:''}</div>`:`
  <div class="card"><h2 style="margin-top:0">Check Out</h2>
    <label>Checkout Date</label><input type="date" id="cod" value="${ymd(new Date())}">
    <label>Deposit Deduction (₹)</label><input type="number" id="cdd" min="0" value="0">
    <label>Deduction Reason</label><input id="cdr" placeholder="e.g. wall damage">
    <div class="muted">Refund = deposit paid minus deduction.</div>
    <button class="p d" onclick="checkout('${t.id}')">Check Out Tenant</button></div>`}
  <h2>Payments</h2>
  ${pays.map(p=>`<div class="card row"><span>${esc(p.date)} · ${esc(p.mode)}${p.forMonth?' · for '+p.forMonth:''}</span><span><b>${money(p.amount)}</b> <button class="s d" onclick="delPay('${p.id}')">Delete</button></span></div>`).join('')||'<div class="muted">No Payments Yet.</div>'}
  <button class="s d" onclick="delT('${t.id}')">Delete This Tenant Record</button>`;
}
function checkout(id){
  const t=db.tenants.find(x=>x.id===id);
  const ded=Number($('cdd'))||0;
  if(!$('cod'))return fail('Checkout date is required.');
  if(ded<0||ded>t.depositPaid)return fail('Deduction must be between 0 and the deposit paid.');
  t.checkout=$('cod'); t.deductions=ded; t.deductReason=$('cdr'); t.refund=t.depositPaid-ded;
  save(); flash('Tenant checked out. Bed is now vacant.'); render();
}
function delT(id){
  if(!armed('t|'+id))return;
  db.tenants=db.tenants.filter(t=>t.id!==id);
  db.payments=db.payments.filter(p=>p.tenantId!==id);
  ui.tenant=null; save(); flash('Tenant deleted.'); render();
}

/* ---------- Expenses ---------- */
function exp(){
  const p=curProp();
  if(!p)return '<div class="card muted">Add A Property In The Property Details Tab First.</div>';
  const list=db.expenses.filter(e=>e.propId===p.id).sort((a,b)=>b.date.localeCompare(a.date));
  return `<div class="card"><label>Property</label>${propSelect('xprop',p.id,'setExp')}</div><h2 style="margin-top:0">Opex · ${esc(p.name)}</h2><div class="tiles"><div class="tile"><span class="tile-ic">💸</span><div><div class="muted">Entries</div><div class="tile-v">${db.expenses.filter(e=>e.propId===p.id).length}</div></div></div><div class="tile"><span class="tile-ic">₹</span><div><div class="muted">Total Recorded</div><div class="tile-v">${money(db.expenses.filter(e=>e.propId===p.id).reduce((s,e)=>s+e.amount,0))}</div></div></div></div><div class="card"><h2 style="margin-top:0">Add Expense</h2>
    <label>Category</label><select id="ec">${CATS.map(c=>`<option>${c}</option>`).join('')}</select>
    <label>Date</label><input type="date" id="ed" value="${ymd(new Date())}">
    <label>Amount (₹)</label><input type="number" id="ea" min="1">
    <label>Notes</label><input id="en" placeholder="e.g. June electricity bill"><button class="s" onclick="voice('en')">🎙 Speak</button>
    <label><input type="checkbox" id="er" style="width:auto"> Recurring monthly bill (counts every month from this date)</label>
    <button class="p" onclick="addExp()">Save Expense</button></div>
  ${list.map(e=>`<div class="card row"><div><b>${esc(e.category)}</b>${e.recurring?' <span class="tag">Monthly</span>':''}<div class="muted">${esc(e.date)} · ${esc(e.notes)}</div></div>
    <div><b>${money(e.amount)}</b> <button class="s d" onclick="delE('${e.id}')">Delete</button></div></div>`).join('')||'<div class="muted">No Expenses Yet.</div>'}`;
}
function addExp(){
  const p=curProp();
  if(!p)return fail('Add a property first.');
  const amt=Number($('ea'));
  if(!(amt>0))return fail('Amount must be above 0.');
  db.expenses.push({id:uid(),propId:p.id,category:$('ec'),date:$('ed')||ymd(new Date()),amount:amt,notes:$('en'),recurring:document.getElementById('er').checked});
  save(); flash('Expense saved.'); render();
}
function delE(id){db.expenses=db.expenses.filter(e=>e.id!==id);save();flash('Expense deleted.');render();}

/* ---------- Backup ---------- */
function backup(){
  return `<div class="tiles"><div class="tile"><span class="tile-ic">💾</span><div><div class="muted">Stored On This Device</div><div class="tile-v">${db.tenants.length} Tenants</div></div></div></div><div class="card"><h2 style="margin-top:0">Backup</h2>
    <div class="muted">All Data Is Stored Only In This Browser On This Device. Export A Backup Regularly, And Before Clearing Browser Data.</div>
    <button class="p" onclick="exportData()">Export Backup File</button>
    <label style="margin-top:14px">Restore From A Backup File (Replaces Current Data)</label>
    <input type="file" accept="application/json" onchange="importData(this.files[0])"></div>
  <div class="card"><h2 style="margin-top:0">Account</h2><div class="muted">Signed in as ${esc((currentUser()||{}).name||"")}${currentUser()?" ("+esc(currentUser().email||currentUser().mobile)+")":""}</div><button class="s d" onclick="signOut()">Sign Out</button></div>
  <div class="card"><h2 style="margin-top:0">Appearance</h2>
    <label>Accent Colour</label>
    <div class="row" style="justify-content:flex-start;gap:10px">${ACCENTS.map((a,i)=>`<button onclick="setAccent(${i})" title="Colour ${i+1}" style="width:36px;height:36px;border-radius:50%;border:${(db.settings.accent||0)===i?'3px solid var(--ink)':'2px solid var(--line)'};background:linear-gradient(135deg,${a[0]},${a[1]});cursor:pointer"></button>`).join('')}</div>
    <label>Background</label>
    <div class="row" style="justify-content:flex-start;gap:8px">${['system','light','dark'].map(md=>`<button class="s" onclick="setMode('${md}')" style="${(db.settings.mode||'system')===md?'border-color:var(--acc);color:var(--acc)':''}">${md[0].toUpperCase()+md.slice(1)}</button>`).join('')}</div>
    <label>Background Style</label>
    <div class="row" style="justify-content:flex-start;gap:8px;flex-wrap:wrap">${BGS.map((b,i)=>`<button onclick="setBg(${i})" title="${b[0]}" style="width:52px;height:36px;border-radius:10px;border:${(db.settings.bg||0)===i?'3px solid var(--ink)':'1px solid var(--line)'};background:${b[1]};cursor:pointer"></button>`).join('')}</div>
    <div class="muted" style="margin-top:6px">${BGS.map(b=>b[0]).join(' · ')}</div>
    <label>Card Colour (Text Adjusts Automatically)</label>
    <div class="row" style="justify-content:flex-start;gap:8px;flex-wrap:wrap">${CARDS.map((c,i)=>`<button onclick="setCard(${i})" title="${c[0]}" style="width:44px;height:36px;border-radius:10px;border:${(db.settings.card||0)===i?'3px solid var(--acc)':'1px solid var(--line)'};background:${c[1]||'var(--card)'};cursor:pointer;color:${c[2]||'var(--ink)'};font-size:10px;font-weight:700">Aa</button>`).join('')}</div>
    <div class="muted" style="margin-top:6px">${CARDS.map(c=>c[0]).join(' · ')}</div>
    <label>Title Bar Colour</label>
    <div class="row" style="justify-content:flex-start;gap:8px;flex-wrap:wrap">${HDRS.map((c,i)=>`<button onclick="setHdr(${i})" title="${c[0]}" style="width:52px;height:30px;border-radius:10px;border:${(db.settings.hdr||0)===i?'3px solid var(--ink)':'1px solid var(--line)'};background:${c[1]};cursor:pointer"></button>`).join('')}</div>
    <div class="muted" style="margin-top:6px">${HDRS.map(c=>c[0]).join(' · ')}</div>
  </div>
  <div class="card"><h2 style="margin-top:0">Payment QR</h2>
    <label>Google Pay QR Image Link</label>
    <input id="qrl" value="${esc(db.settings.qrUrl||'')}" placeholder="https://...">
    <button class="s" onclick="setQr()">Save QR Link</button>
    <div class="muted">Paste a public link to your Google Pay QR image. It is added to every dues message.</div>
  </div>
  <div class="card"><h2 style="margin-top:0">Erase Data</h2>
    ${ui.wipe?`<label>${db.settings.pass?'Enter Passcode':'Set A 6-Digit Passcode'}</label>
      <input id="wpc" type="password" inputmode="numeric" maxlength="6" pattern="[0-9]{6}" placeholder="6 digits">
      <button class="p d" onclick="wipeAction()">${db.settings.pass?'Erase All Data':'Save Passcode'}</button>
      <button class="s" onclick="ui.wipe=false;render()">Cancel</button>`
     :`<button class="s d" onclick="startWipe()">Erase All Data On This Device</button>`}
    ${db.settings.pass?(ui.pwMode==='change'?`<label>Current Passcode</label><input id="pwold" type="password" inputmode="numeric" maxlength="6"><label>New 6-Digit Passcode</label><input id="pwnew" type="password" inputmode="numeric" maxlength="6"><button class="p" onclick="changePass()">Save New Passcode</button><button class="s" onclick="ui.pwMode=null;render()">Cancel</button>`:`<div class="muted" style="margin-top:10px">Passcode is set.</div><button class="s" onclick="startChangePass()">Change Passcode</button> <button class="s d" onclick="resetPass()">Forgot Passcode? Remove It</button>`):''}
  </div>`;
}
async function exportData(){
  const name='pg-guru-backup-'+ymd(new Date())+'.json';
  const json=JSON.stringify(db,null,2);
  let dl=null;
  try{dl=window.claude?await window.claude.use('downloads'):null;}catch(err){dl=null;}
  if(!dl){flash('Backup saving is not available in this view. Open the app from its own link to export a backup.',true);render();return;}
  try{
    await dl.save({filename:name,data:json});
    flash('Backup saved.');
  }catch(err){
    flash(err&&err.code==='declined'?'Backup cancelled.':'Could not save the backup in this view. Try again later.',true);
  }
  render();
}
function importData(file){
  if(!file)return;
  const r=new FileReader();
  r.onload=()=>{
    let d;
    try{d=JSON.parse(r.result);}catch(e){return fail('That file is not a valid backup.');}
    const ok=['properties','beds','tenants','payments','expenses'].every(k=>Array.isArray(d[k]));
    if(!ok)return fail('That file is not a valid backup.');
    if(!confirm('Replace all current data with this backup?'))return;
    db=Object.assign({},EMPTY,d); normBeds(); save(); flash('Backup restored.'); render();
  };
  r.readAsText(file);
}

render();
</script>
</body>
